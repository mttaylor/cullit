name: Label new issues
on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Auto-label by title prefix
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title.toLowerCase();
            const labels = [];
            if (title.startsWith('[bug]') || title.includes('bug')) labels.push('bug');
            if (title.startsWith('[feature]') || title.startsWith('[feat]')) labels.push('enhancement');
            if (title.startsWith('[docs]')) labels.push('documentation');
            if (title.startsWith('[question]') || title.startsWith('[q]')) labels.push('question');
            if (title.includes('crash') || title.includes('broken')) labels.push('bug');
            if (labels.length) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                labels: [...new Set(labels)],
              });
            }
