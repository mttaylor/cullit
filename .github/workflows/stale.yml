name: Close Stale Issues
on:
  schedule:
    - cron: '0 0 * * *'  # daily
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - name: Mark and close stale issues / PRs
        uses: actions/stale@v9
        with:
          days-before-stale: 30
          days-before-close: 7
          stale-issue-message: |
            👋 This issue hasn't been updated in 30 days. We're marking it as stale.
            - If this is still relevant, please comment with a quick update.
            - If you've moved on, no worries — we'll close this in 7 days.
          close-issue-message: |
            Closing this as stale. If it comes back up, just open a new issue with a link to this one.
          stale-pr-message: |
            👋 This PR hasn't been updated in 30 days. We're marking it as stale.
            - If you're still working on it, push a commit and we're good.
            - Otherwise we'll close in 7 days to keep the queue clean.
          close-pr-message: |
            Closing as stale. Feel free to reopen when you're back.
          exempt-issue-labels: 'pinned,security,good first issue,help wanted'
          exempt-pr-labels: 'pinned,work-in-progress'
          operations-per-run: 30
